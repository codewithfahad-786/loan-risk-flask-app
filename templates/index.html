<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Loan Risk Prediction System</title>

    <link rel="stylesheet" href="/static/style.css">

</head>


<body>


<div class="container">


    <h1>🏦 Loan Risk Prediction System</h1>

    <p class="subtitle">
        Intelligent Banking Risk Assessment using Artificial Neural Network
    </p>



    <form action="/predict" method="POST">


        <div class="grid">


            <div>
                <label>Applicant Income</label>
                <input type="number" name="ApplicantIncome" required>
            </div>


            <div>
                <label>Coapplicant Income</label>
                <input type="number" name="CoapplicantIncome" required>
            </div>


            <div>
                <label>Loan Amount</label>
                <input type="number" name="LoanAmount" required>
            </div>


            <div>
                <label>Loan Amount Term</label>
                <input type="number" name="Loan_Amount_Term" value="360" required>
            </div>


            <div>
                <label>Credit History</label>

                <select name="Credit_History">

                    <option value="1">
                        Good Credit History
                    </option>

                    <option value="0">
                        Bad Credit History
                    </option>

                </select>

            </div>



            <div>
                <label>Gender</label>

                <select name="Gender">

                    <option value="Male">
                        Male
                    </option>

                    <option value="Female">
                        Female
                    </option>

                </select>

            </div>



            <div>
                <label>Married</label>

                <select name="Married">

                    <option value="Yes">
                        Yes
                    </option>

                    <option value="No">
                        No
                    </option>

                </select>

            </div>




            <div>
                <label>Dependents</label>

                <select name="Dependents">

                    <option value="0">
                        0
                    </option>

                    <option value="1">
                        1
                    </option>

                    <option value="2">
                        2
                    </option>

                    <option value="3+">
                        3+
                    </option>

                </select>

            </div>




            <div>
                <label>Education</label>

                <select name="Education">

                    <option value="Graduate">
                        Graduate
                    </option>

                    <option value="Not Graduate">
                        Not Graduate
                    </option>

                </select>

            </div>





            <div>
                <label>Self Employed</label>

                <select name="Self_Employed">

                    <option value="Yes">
                        Yes
                    </option>

                    <option value="No">
                        No
                    </option>

                </select>

            </div>





            <div>
                <label>Property Area</label>

                <select name="Property_Area">

                    <option value="Urban">
                        Urban
                    </option>

                    <option value="Semiurban">
                        Semiurban
                    </option>

                    <option value="Rural">
                        Rural
                    </option>

                </select>

            </div>


        </div>


        <button type="submit">
            Predict Loan Risk
        </button>


    </form>



    {% if prediction %}

<div class="result">

    <h2>Prediction Result</h2>

    <h1>{{ prediction }}</h1>

    <p><strong>Confidence:</strong> {{ confidence }}%</p>

    <p>{{ message }}</p>

</div>

{% endif %}



</div>


</body>

</html>
